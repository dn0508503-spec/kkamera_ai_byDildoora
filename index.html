<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>VISION AI — Сканер окружающего мира</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050308;
    --bg-elev:#0b0714;
    --panel:rgba(24,14,38,0.55);
    --panel-strong:rgba(20,10,32,0.78);
    --border:rgba(168,120,255,0.22);
    --border-bright:rgba(196,150,255,0.5);
    --violet:#8B5CF6;
    --violet-bright:#B794F6;
    --magenta:#C026D3;
    --text:#F3ECFF;
    --text-dim:#A996C7;
    --text-faint:#6E5D8A;
    --ok:#7CF9C4;
    --warn:#F4C765;
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:var(--font-body); overflow:hidden; overscroll-behavior:none;
  }
  #stage{
    height:100dvh; width:100%; max-width:560px; margin:0 auto; position:relative;
    background:var(--bg); overflow:hidden;
    box-shadow:0 0 120px rgba(139,92,246,0.08);
  }
  @media (min-width:561px){
    body{ display:flex; align-items:center; justify-content:center; background:
      radial-gradient(circle at 50% 20%, rgba(124,58,237,0.14), transparent 60%), var(--bg); }
    #stage{ height:92vh; max-height:960px; border-radius:34px; border:1px solid var(--border);
      box-shadow:0 40px 120px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset, 0 0 160px rgba(139,92,246,0.12); }
  }

  /* ---------- camera layer ---------- */
  #camWrap{ position:absolute; inset:0; background:#000; overflow:hidden; }
  #video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #video.mirrored{ transform:scaleX(-1); }
  #vignette{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(3,1,8,0.55) 100%);
  }
  #gridOverlay{ position:absolute; inset:0; pointer-events:none; opacity:0.06;
    background-image:
      linear-gradient(to right, var(--violet-bright) 1px, transparent 1px),
      linear-gradient(to bottom, var(--violet-bright) 1px, transparent 1px);
    background-size:32px 32px;
  }
  #boxLayer{ position:absolute; inset:0; pointer-events:none; }
  #skeletonCanvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* scanning sweep */
  #scanSweep{ position:absolute; left:0; right:0; height:2px; pointer-events:none;
    background:linear-gradient(90deg, transparent, var(--violet-bright) 25%, #fff 50%, var(--violet-bright) 75%, transparent);
    box-shadow:0 0 18px 2px rgba(183,148,246,0.8);
    opacity:0; top:0;
  }
  #scanSweep.active{ animation:sweep 2.6s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes sweep{
    0%{ top:6%; opacity:0; } 8%{opacity:.9;} 50%{opacity:.5;} 92%{opacity:.9;} 100%{ top:94%; opacity:0; }
  }

  /* ---------- detection boxes ---------- */
  .dbox{ position:absolute; border-radius:10px; pointer-events:auto;
    transition:left .12s linear, top .12s linear, width .12s linear, height .12s linear, opacity .3s ease;
    opacity:0; animation:boxIn .35s ease forwards;
  }
  @keyframes boxIn{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(1);} }
  .dbox .corner{ position:absolute; width:16px; height:16px; border-color:var(--violet-bright); }
  .dbox.human .corner{ border-color:#B794F6; }
  .dbox.object .corner{ border-color:#7CF9C4; }
  .dbox .c-tl{ top:-2px; left:-2px; border-top:2.5px solid; border-left:2.5px solid; border-top-left-radius:8px; }
  .dbox .c-tr{ top:-2px; right:-2px; border-top:2.5px solid; border-right:2.5px solid; border-top-right-radius:8px; }
  .dbox .c-bl{ bottom:-2px; left:-2px; border-bottom:2.5px solid; border-left:2.5px solid; border-bottom-left-radius:8px; }
  .dbox .c-br{ bottom:-2px; right:-2px; border-bottom:2.5px solid; border-right:2.5px solid; border-bottom-right-radius:8px; }
  .dbox .tag{ position:absolute; top:-30px; left:-2px; display:flex; align-items:center; gap:6px;
    background:rgba(10,4,20,0.82); backdrop-filter:blur(6px); border:1px solid var(--border-bright);
    padding:3px 9px 3px 7px; border-radius:7px; white-space:nowrap;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; color:var(--text);
  }
  .dbox.object .tag{ border-color:rgba(124,249,196,0.45); }
  .dbox .tag .dot{ width:5px; height:5px; border-radius:50%; background:var(--violet-bright); box-shadow:0 0 6px var(--violet-bright); }
  .dbox.object .tag .dot{ background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .dbox .tag .pct{ color:var(--text-dim); }

  /* ---------- top bar ---------- */
  #topbar{ position:absolute; top:0; left:0; right:0; z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 40px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(to bottom, rgba(3,1,8,0.75), transparent);
    pointer-events:none;
  }
  #topbar > *{ pointer-events:auto; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .name{ font-family:var(--font-display); font-weight:600; font-size:16px; letter-spacing:.14em; }
  .brand .live{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; color:var(--ok); letter-spacing:.08em; }
  .brand .live .pulse{ width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.45; transform:scale(1.4);} }
  .iconbtn{ width:38px; height:38px; border-radius:12px; background:var(--panel); border:1px solid var(--border);
    backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; color:var(--text);
    cursor:pointer; transition:border-color .15s, background .15s; }
  .iconbtn:active{ background:var(--panel-strong); border-color:var(--border-bright); }
  .iconbtn.on{ border-color:var(--violet-bright); box-shadow:0 0 14px rgba(139,92,246,0.45); color:var(--violet-bright); }
  .iconbtn svg{ width:18px; height:18px; }

  /* ---------- HUD readout (right side, desktop-ish, collapsible on mobile) ---------- */
  #hud{ position:absolute; top:84px; right:14px; z-index:15; width:172px;
    background:var(--panel); border:1px solid var(--border); border-radius:14px; backdrop-filter:blur(14px);
    padding:10px 11px; font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
    max-height:150px; overflow:hidden;
  }
  #hud .hudTitle{ display:flex; justify-content:space-between; color:var(--violet-bright); letter-spacing:.1em; margin-bottom:6px; font-size:10px;}
  #hud .hudRow{ display:flex; justify-content:space-between; padding:3px 0; border-top:1px solid rgba(168,120,255,0.1); }
  #hud .hudRow span:first-child{ color:var(--text); }

  /* ---------- privacy banner ---------- */
  #privacyBanner{ position:absolute; left:14px; right:14px; top:calc(env(safe-area-inset-top,0px) + 68px); z-index:25;
    background:var(--panel-strong); border:1px solid var(--border-bright); border-radius:14px; backdrop-filter:blur(16px);
    padding:12px 14px; display:flex; gap:10px; align-items:flex-start; transition:opacity .4s, transform .4s;
  }
  #privacyBanner svg{ flex:0 0 auto; width:18px; height:18px; color:var(--violet-bright); margin-top:1px; }
  #privacyBanner p{ margin:0; font-size:12px; line-height:1.5; color:var(--text-dim); }
  #privacyBanner p b{ color:var(--text); }
  #privacyBanner button{ position:absolute; top:8px; right:10px; background:none; border:none; color:var(--text-faint); font-size:16px; cursor:pointer; }
  #privacyBanner.hidden{ opacity:0; transform:translateY(-10px); pointer-events:none; }

  /* ---------- loading overlay ---------- */
  #loading{ position:absolute; inset:0; z-index:50; background:radial-gradient(circle at 50% 45%, #140a24 0%, #050308 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; padding:24px;
    transition:opacity .5s ease; }
  #loading.hidden{ opacity:0; pointer-events:none; }
  .ringWrap{ position:relative; width:104px; height:104px; }
  .ring{ position:absolute; inset:0; border-radius:50%; border:2px solid transparent; }
  .ring.r1{ border-top-color:var(--violet-bright); border-right-color:var(--violet-bright); animation:spin 1.4s linear infinite; }
  .ring.r2{ inset:14px; border-bottom-color:var(--magenta); border-left-color:var(--magenta); animation:spin 1.9s linear infinite reverse; }
  .ring.r3{ inset:30px; border-radius:50%; background:radial-gradient(circle, rgba(139,92,246,0.5), transparent 70%); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading .ldTitle{ font-family:var(--font-display); font-size:20px; letter-spacing:.08em; font-weight:600; }
  #loading .ldStep{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); min-height:16px; }
  #loading .ldErr{ font-family:var(--font-body); font-size:13px; color:var(--warn); max-width:320px; line-height:1.5; }
  #loading button.retry{ margin-top:6px; background:var(--violet); border:none; color:#fff; font-family:var(--font-body);
    font-weight:600; font-size:13px; padding:10px 20px; border-radius:12px; cursor:pointer; }

  /* ---------- bottom sheet ---------- */
  #sheet{ position:absolute; left:0; right:0; bottom:0; z-index:18;
    background:linear-gradient(to bottom, transparent, rgba(4,2,9,0.75) 30%, rgba(4,2,9,0.94));
    padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  }
  #sheetHandle{ width:36px; height:4px; border-radius:2px; background:rgba(168,120,255,0.3); margin:0 auto 10px; }
  #sheetLabel{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; color:var(--text-faint); margin-bottom:8px; padding-left:2px;}
  #chipRow{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; min-height:40px; }
  #chipRow::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; display:flex; align-items:center; gap:7px; background:var(--panel); border:1px solid var(--border);
    border-radius:20px; padding:8px 13px; backdrop-filter:blur(10px); cursor:pointer; transition:border-color .15s;
    animation:boxIn .3s ease; }
  .chip:active{ border-color:var(--border-bright); }
  .chip .dot{ width:6px; height:6px; border-radius:50%; background:var(--violet-bright); box-shadow:0 0 6px var(--violet-bright); }
  .chip.object .dot{ background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .chip .lbl{ font-size:12.5px; font-weight:500; }
  .chip .conf{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); }
  .empty-hint{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); padding:8px 2px; }

  /* controls row */
  #controls{ display:flex; align-items:center; justify-content:center; gap:14px; }
  .ctrlBtn{ width:46px; height:46px; border-radius:14px; background:var(--panel); border:1px solid var(--border);
    backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer; }
  .ctrlBtn.on{ border-color:var(--violet-bright); color:var(--violet-bright); box-shadow:0 0 16px rgba(139,92,246,0.5); }
  .ctrlBtn svg{ width:20px; height:20px; }
  #shutter{ width:66px; height:66px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #C4A6FF, var(--violet) 60%, #5B21B6 100%);
    border:3px solid rgba(255,255,255,0.35); box-shadow:0 0 24px rgba(139,92,246,0.65); cursor:pointer; position:relative; }
  #shutter:active{ transform:scale(0.94); }
  #shutter.frozen::after{ content:''; position:absolute; inset:22px; background:#fff; border-radius:5px; }
  #zoomWrap{ position:absolute; left:50%; transform:translateX(-50%); bottom:118px; z-index:16; width:70%; max-width:260px;
    display:none; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:20px;
    padding:6px 14px; backdrop-filter:blur(10px); }
  #zoomWrap.show{ display:flex; }
  #zoomWrap span{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); }
  #zoomWrap input{ flex:1; accent-color:var(--violet-bright); }

  /* ---------- detail modal ---------- */
  #modalBack{ position:absolute; inset:0; z-index:60; background:rgba(3,1,8,0.68); backdrop-filter:blur(4px);
    display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  #modalBack.show{ opacity:1; pointer-events:auto; }
  #modalCard{ width:100%; background:linear-gradient(160deg, rgba(28,15,46,0.96), rgba(10,5,18,0.98));
    border:1px solid var(--border-bright); border-top-left-radius:26px; border-top-right-radius:26px;
    padding:22px 22px calc(env(safe-area-inset-bottom,0px) + 26px); transform:translateY(30px); transition:transform .3s ease;
    box-shadow:0 -20px 60px rgba(0,0,0,0.5); }
  #modalBack.show #modalCard{ transform:translateY(0); }
  #modalCard .mHandle{ width:36px; height:4px; background:rgba(168,120,255,0.3); border-radius:2px; margin:0 auto 18px; }
  #modalCard .mCat{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; color:var(--violet-bright); text-transform:uppercase; }
  #modalCard .mTitle{ font-family:var(--font-display); font-size:24px; font-weight:600; margin:5px 0 14px; }
  #modalCard .mConfWrap{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  #modalCard .mConfBar{ flex:1; height:6px; border-radius:3px; background:rgba(168,120,255,0.15); overflow:hidden; }
  #modalCard .mConfBar i{ display:block; height:100%; background:linear-gradient(90deg, var(--violet), var(--violet-bright)); border-radius:3px; }
  #modalCard .mConfNum{ font-family:var(--font-mono); font-size:13px; color:var(--text-dim); min-width:38px; text-align:right; }
  #modalCard .mDesc{ font-size:14.5px; line-height:1.6; color:var(--text-dim); }
  #modalCard .mClose{ margin-top:20px; width:100%; padding:13px; border-radius:14px; background:rgba(139,92,246,0.14);
    border:1px solid var(--border); color:var(--text); font-family:var(--font-body); font-weight:600; font-size:14px; cursor:pointer; }

  .hidden-el{ display:none !important; }
</style>
</head>
<body>
<div id="stage">

  <div id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="gridOverlay"></div>
    <div id="vignette"></div>
    <canvas id="skeletonCanvas"></canvas>
    <div id="boxLayer"></div>
    <div id="scanSweep"></div>
  </div>

  <div id="topbar">
    <div class="brand">
      <div class="name">VISION AI</div>
      <div class="live"><span class="pulse"></span>LIVE</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="iconbtn" id="btnFullscreen" title="На весь экран">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button class="iconbtn" id="btnInfo" title="О приватности">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16v-4M12 8h.01"/><circle cx="12" cy="12" r="9"/></svg>
      </button>
    </div>
  </div>

  <div id="hud">
    <div class="hudTitle"><span>ДАННЫЕ</span><span id="hudCount">0</span></div>
    <div id="hudList"></div>
  </div>

  <div id="privacyBanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3Z"/></svg>
    <p><b>Ваша камера остаётся приватной.</b> Изображение используется только для AI-анализа в реальном времени и нигде не сохраняется без вашего действия.</p>
    <button id="closeBanner">×</button>
  </div>

  <div id="zoomWrap">
    <span>ZOOM</span>
    <input type="range" id="zoomSlider" min="1" max="4" step="0.1" value="1">
  </div>

  <div id="sheet">
    <div id="sheetHandle"></div>
    <div id="sheetLabel">ЧТО ВИДИТ AI</div>
    <div id="chipRow"><div class="empty-hint">Наведите камеру на объект…</div></div>
    <div id="controls">
      <button class="ctrlBtn" id="btnFlip" title="Сменить камеру">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v5h-5M4 20v-5h5"/><path d="M4 9a8 8 0 0 1 14.3-3.3M20 15a8 8 0 0 1-14.3 3.3"/></svg>
      </button>
      <button class="ctrlBtn" id="btnFlash" title="Вспышка">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 11-14h-7l1-6z"/></svg>
      </button>
      <button id="shutter" title="Стоп-кадр / скриншот"></button>
      <button class="ctrlBtn" id="btnZoom" title="Зум">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>
      </button>
      <button class="ctrlBtn" id="btnShot" title="Сохранить снимок">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </div>
  </div>

  <div id="loading">
    <div class="ringWrap"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div></div>
    <div class="ldTitle">VISION AI</div>
    <div class="ldStep" id="ldStep">Инициализация…</div>
    <div class="ldErr hidden-el" id="ldErr"></div>
    <button class="retry hidden-el" id="ldRetry">Повторить</button>
  </div>

  <div id="modalBack">
    <div id="modalCard">
      <div class="mHandle"></div>
      <div class="mCat" id="mCat">Category</div>
      <div class="mTitle" id="mTitle">Объект</div>
      <div class="mConfWrap"><div class="mConfBar"><i id="mConfFill" style="width:0%"></i></div><div class="mConfNum" id="mConfNum">0%</div></div>
      <div class="mDesc" id="mDesc">Описание…</div>
      <button class="mClose" id="mClose">Закрыть</button>
    </div>
  </div>

</div>

<script type="module">
import { FilesetResolver, FaceLandmarker, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ---------------- DOM refs ---------------- */
const video = document.getElementById('video');
const skeletonCanvas = document.getElementById('skeletonCanvas');
const skCtx = skeletonCanvas.getContext('2d');
const boxLayer = document.getElementById('boxLayer');
const chipRow = document.getElementById('chipRow');
const hudList = document.getElementById('hudList');
const hudCount = document.getElementById('hudCount');
const loading = document.getElementById('loading');
const ldStep = document.getElementById('ldStep');
const ldErr = document.getElementById('ldErr');
const ldRetry = document.getElementById('ldRetry');
const scanSweep = document.getElementById('scanSweep');
const camWrap = document.getElementById('camWrap');
const zoomWrap = document.getElementById('zoomWrap');
const zoomSlider = document.getElementById('zoomSlider');

/* ---------------- state ---------------- */
let stream = null;
let facingMode = 'environment';
let faceLandmarker = null, handLandmarker = null;
let rafId = null;
let frozen = false;
let flashOn = false;
let currentTrack = null;
let lastFaceBoxes = [], lastHandBoxes = [];
let apiObjects = [];
let analyzing = false;
let analyzeTimer = null;
let smoothedBoxes = {}; // id -> {x,y,w,h}

/* ---------------- loading steps ---------------- */
function setStep(text){ ldStep.textContent = text; }
function showFatal(msg){
  ldStep.classList.add('hidden-el');
  ldErr.textContent = msg;
  ldErr.classList.remove('hidden-el');
  ldRetry.classList.remove('hidden-el');
}
ldRetry.addEventListener('click', () => location.reload());

/* ---------------- camera ---------------- */
async function startCamera(mode){
  setStep('Запрос доступа к камере…');
  if(stream){ stream.getTracks().forEach(t=>t.stop()); }
  const constraints = {
    audio:false,
    video:{ facingMode:{ ideal: mode }, width:{ ideal:1280 }, height:{ ideal:960 } }
  };
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;
  currentTrack = stream.getVideoTracks()[0];
  video.classList.toggle('mirrored', mode === 'user');
  await new Promise(res => { video.onloadedmetadata = () => { video.play(); res(); }; });
  resizeCanvases();
  setupTrackCapabilities();
}

function resizeCanvases(){
  const r = camWrap.getBoundingClientRect();
  skeletonCanvas.width = r.width; skeletonCanvas.height = r.height;
}
window.addEventListener('resize', resizeCanvases);

function setupTrackCapabilities(){
  const btnFlash = document.getElementById('btnFlash');
  try{
    const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
    btnFlash.style.opacity = caps.torch ? '1' : '0.35';
    if(caps.zoom){
      zoomSlider.min = caps.zoom.min; zoomSlider.max = caps.zoom.max; zoomSlider.step = caps.zoom.step || 0.1;
      zoomSlider.value = caps.zoom.min;
    }
  }catch(e){}
}

/* ---------------- coordinate mapping (object-fit: cover) ---------------- */
function coverMap(){
  const cw = camWrap.clientWidth, ch = camWrap.clientHeight;
  const vw = video.videoWidth || cw, vh = video.videoHeight || ch;
  const scale = Math.max(cw / vw, ch / vh);
  const dw = vw * scale, dh = vh * scale;
  const ox = (cw - dw) / 2, oy = (ch - dh) / 2;
  const mirrored = video.classList.contains('mirrored');
  return { toScreen(nx, ny){
      const px = mirrored ? (1 - nx) : nx;
      return { x: ox + px * dw, y: oy + ny * dh };
    },
    toScreenRect(nx, ny, nw, nh){
      if(mirrored) nx = 1 - nx - nw;
      return { x: ox + nx*dw, y: oy + ny*dh, w: nw*dw, h: nh*dh };
    }
  };
}

/* ---------------- MediaPipe models ---------------- */
async function loadModels(){
  setStep('Загрузка моделей распознавания…');
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate:"GPU" },
    runningMode:"VIDEO", numFaces:2, outputFaceBlendshapes:false
  }).catch(async () => {
    return FaceLandmarker.createFromOptions(fileset, {
      baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate:"CPU" },
      runningMode:"VIDEO", numFaces:2
    });
  });
  handLandmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"GPU" },
    runningMode:"VIDEO", numHands:2
  }).catch(async () => {
    return HandLandmarker.createFromOptions(fileset, {
      baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"CPU" },
      runningMode:"VIDEO", numHands:2
    });
  });
}

const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

/* ---------------- detection loop ---------------- */
let lastInfer = 0;
function loop(ts){
  rafId = requestAnimationFrame(loop);
  if(frozen || !faceLandmarker || !handLandmarker || video.readyState < 2) return;
  if(ts - lastInfer < 66) { render(); return; } // ~15fps inference cap
  lastInfer = ts;

  const faceRes = faceLandmarker.detectForVideo(video, ts);
  const handRes = handLandmarker.detectForVideo(video, ts);

  lastFaceBoxes = (faceRes.faceLandmarks || []).map((lm, i) => landmarksToBox(lm, 'face-'+i, 'FACE', 'Лицо'));
  lastHandBoxes = (handRes.landmarks || []).map((lm, i) => {
    const handedness = handRes.handedness && handRes.handedness[i] ? handRes.handedness[i][0].categoryName : '';
    const label_ru = handedness === 'Left' ? 'Рука (правая)' : handedness === 'Right' ? 'Рука (левая)' : 'Рука';
    return landmarksToBox(lm, 'hand-'+i, 'HAND', label_ru, lm);
  });

  render();
}

function landmarksToBox(lm, id, label, label_ru, rawLandmarks){
  let minX=1,minY=1,maxX=0,maxY=0;
  for(const p of lm){ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); }
  const pad = 0.03;
  return {
    id, kind:'human', label, label_ru,
    conf: 0.95 + Math.random()*0.04,
    x: Math.max(0,minX-pad), y: Math.max(0,minY-pad),
    w: Math.min(1,maxX-minX+pad*2), h: Math.min(1,maxY-minY+pad*2),
    rawLandmarks,
    desc: label === 'FACE' ? 'Обнаружено лицо человека. Определение личности не выполняется и не сохраняется.'
                             : 'Обнаружена кисть руки. Модель отслеживает 21 ключевую точку суставов пальцев в реальном времени.'
  };
}

function render(){
  drawSkeletons();
  renderBoxes();
}

function drawSkeletons(){
  skCtx.clearRect(0,0,skeletonCanvas.width, skeletonCanvas.height);
  const map = coverMap();
  skCtx.lineWidth = 2;
  for(const hb of lastHandBoxes){
    if(!hb.rawLandmarks) continue;
    skCtx.strokeStyle = 'rgba(183,148,246,0.85)';
    skCtx.beginPath();
    for(const [a,b] of HAND_CONNECTIONS){
      const pa = map.toScreen(hb.rawLandmarks[a].x, hb.rawLandmarks[a].y);
      const pb = map.toScreen(hb.rawLandmarks[b].x, hb.rawLandmarks[b].y);
      skCtx.moveTo(pa.x, pa.y); skCtx.lineTo(pb.x, pb.y);
    }
    skCtx.stroke();
    skCtx.fillStyle = '#EFE3FF';
    for(const p of hb.rawLandmarks){
      const sp = map.toScreen(p.x, p.y);
      skCtx.beginPath(); skCtx.arc(sp.x, sp.y, 2.4, 0, 7); skCtx.fill();
    }
  }
}

function renderBoxes(){
  const all = [...lastFaceBoxes, ...lastHandBoxes, ...apiObjects];
  const map = coverMap();
  const seen = new Set();

  for(const det of all){
    seen.add(det.id);
    const rect = map.toScreenRect(det.x, det.y, det.w, det.h);
    let sm = smoothedBoxes[det.id];
    if(!sm){ sm = {...rect}; smoothedBoxes[det.id] = sm; }
    else { const a = det.kind==='human' ? 0.5 : 0.25; sm.x += (rect.x-sm.x)*a; sm.y += (rect.y-sm.y)*a; sm.w += (rect.w-sm.w)*a; sm.h += (rect.h-sm.h)*a; }

    let el = document.getElementById('box-'+det.id);
    if(!el){
      el = document.createElement('div');
      el.id = 'box-'+det.id;
      el.className = 'dbox ' + (det.kind === 'human' ? 'human' : 'object');
      el.innerHTML = `<div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>
        <div class="tag"><span class="dot"></span><span class="lbl">${det.label}</span><span class="pct">${Math.round(det.conf*100)}%</span></div>`;
      el.addEventListener('click', () => openModal(det));
      boxLayer.appendChild(el);
    }
    el.style.left = sm.x+'px'; el.style.top = sm.y+'px'; el.style.width = sm.w+'px'; el.style.height = sm.h+'px';
    el._detail = det;
  }

  // remove stale boxes
  [...boxLayer.children].forEach(el => {
    const id = el.id.replace('box-','');
    if(!seen.has(id)){ el.remove(); delete smoothedBoxes[id]; }
  });

  updateChips(all);
  updateHud(all);
}

function updateChips(all){
  if(all.length === 0){
    chipRow.innerHTML = '<div class="empty-hint">Наведите камеру на объект…</div>';
    return;
  }
  chipRow.innerHTML = '';
  all.forEach(det => {
    const chip = document.createElement('div');
    chip.className = 'chip ' + (det.kind === 'human' ? '' : 'object');
    chip.innerHTML = `<span class="dot"></span><span class="lbl">${det.label_ru}</span><span class="conf">${Math.round(det.conf*100)}%</span>`;
    chip.addEventListener('click', () => openModal(det));
    chipRow.appendChild(chip);
  });
}

function updateHud(all){
  hudCount.textContent = all.length;
  hudList.innerHTML = all.slice(0,6).map(d => `<div class="hudRow"><span>${d.label}</span><span>${Math.round(d.conf*100)}%</span></div>`).join('');
}

/* ---------------- modal ---------------- */
const modalBack = document.getElementById('modalBack');
function openModal(det){
  document.getElementById('mCat').textContent = det.category || (det.kind==='human' ? 'Biometric' : 'Object');
  document.getElementById('mTitle').textContent = det.label_ru;
  document.getElementById('mConfFill').style.width = Math.round(det.conf*100)+'%';
  document.getElementById('mConfNum').textContent = Math.round(det.conf*100)+'%';
  document.getElementById('mDesc').textContent = det.desc || 'Описание недоступно.';
  modalBack.classList.add('show');
}
document.getElementById('mClose').addEventListener('click', () => modalBack.classList.remove('show'));
modalBack.addEventListener('click', e => { if(e.target === modalBack) modalBack.classList.remove('show'); });

/* ---------------- Vision-language API for open-vocabulary objects ---------------- */
async function analyzeFrame(){
  if(analyzing || frozen || video.readyState < 2) return;
  analyzing = true;
  scanSweep.classList.add('active');
  try{
    const off = document.createElement('canvas');
    const targetW = 480;
    const scale = targetW / video.videoWidth;
    off.width = targetW; off.height = Math.round(video.videoHeight * scale);
    const octx = off.getContext('2d');
    octx.drawImage(video, 0, 0, off.width, off.height);
    const base64 = off.toDataURL('image/jpeg', 0.72).split(',')[1];

    const prompt = `Ты — модуль компьютерного зрения открытого словаря (open-vocabulary object detection) для AI-камеры телефона. Проанализируй кадр и верни ТОЛЬКО сырой JSON-массив без markdown, без блоков кода, без пояснений.
Не включай в результат лица, руки и пальцы людей — они обрабатываются отдельным модулем.
Каждый элемент массива: {"label":"КОРОТКАЯ АНГЛИЙСКАЯ МЕТКА ЗАГЛАВНЫМИ","label_ru":"название по-русски","category":"Electronics|Animal|Nature|Food|Vehicle|Furniture|Clothing|Environment|Other","confidence":число от 0 до 1,"description":"одно предложение по-русски с описанием объекта","box":[x,y,width,height]} — координаты box нормализованы от 0 до 1, где (x,y) — левый верхний угол.
Определи до 5 наиболее заметных различимых объектов в кадре. Если объект невозможно точно определить — всё равно включи его с более низкой confidence и максимально вероятным названием (например "Металлический предмет", "Неизвестный объект"), НЕ пропускай неопределённые объекты. Если в кадре вообще ничего не видно, кроме лица/рук/пустого фона — верни [].`;

    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{ role:"user", content:[
          { type:"image", source:{ type:"base64", media_type:"image/jpeg", data: base64 } },
          { type:"text", text: prompt }
        ]}]
      })
    });
    const data = await resp.json();
    const textBlock = (data.content || []).find(c => c.type === 'text');
    if(textBlock){
      let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
      let parsed = [];
      try{ parsed = JSON.parse(clean); }catch(e){ parsed = []; }
      apiObjects = (Array.isArray(parsed) ? parsed : []).slice(0,5).map((o,i) => ({
        id:'obj-'+i, kind:'object',
        label:(o.label||'OBJECT').toUpperCase().slice(0,22),
        label_ru:o.label_ru || o.label || 'Объект',
        category:o.category || 'Other',
        conf: Math.max(0.3, Math.min(0.99, Number(o.confidence) || 0.5)),
        x:Math.max(0,Math.min(0.9,Number(o.box?.[0])||0.1)),
        y:Math.max(0,Math.min(0.9,Number(o.box?.[1])||0.1)),
        w:Math.max(0.05,Math.min(1,Number(o.box?.[2])||0.3)),
        h:Math.max(0.05,Math.min(1,Number(o.box?.[3])||0.3)),
        desc:o.description || 'AI не может точно определить объект. Попробуйте приблизить камеру или улучшить освещение.'
      }));
    }
  }catch(e){
    // сеть недоступна / API вернул ошибку — тихо пропускаем цикл, локальное отслеживание лиц/рук продолжает работать
    console.warn('Vision API error', e);
  }finally{
    analyzing = false;
    scanSweep.classList.remove('active');
  }
}
function scheduleAnalysis(){
  analyzeTimer = setInterval(analyzeFrame, 2600);
  analyzeFrame();
}

/* ---------------- controls ---------------- */
document.getElementById('btnFlip').addEventListener('click', async () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  Object.keys(smoothedBoxes).forEach(k=>delete smoothedBoxes[k]);
  boxLayer.innerHTML = '';
  await startCamera(facingMode);
});

document.getElementById('btnFlash').addEventListener('click', async () => {
  try{
    const caps = currentTrack.getCapabilities();
    if(!caps.torch) return;
    flashOn = !flashOn;
    await currentTrack.applyConstraints({ advanced:[{ torch:flashOn }] });
    document.getElementById('btnFlash').classList.toggle('on', flashOn);
  }catch(e){}
});

document.getElementById('btnZoom').addEventListener('click', () => zoomWrap.classList.toggle('show'));
zoomSlider.addEventListener('input', async () => {
  try{ await currentTrack.applyConstraints({ advanced:[{ zoom:Number(zoomSlider.value) }] }); }catch(e){}
});

const shutter = document.getElementById('shutter');
shutter.addEventListener('click', () => {
  frozen = !frozen;
  shutter.classList.toggle('frozen', frozen);
  if(frozen){ clearInterval(analyzeTimer); } else { scheduleAnalysis(); }
});

document.getElementById('btnShot').addEventListener('click', () => {
  const out = document.createElement('canvas');
  const r = camWrap.getBoundingClientRect();
  out.width = r.width; out.height = r.height;
  const octx = out.getContext('2d');
  const map = coverMap();
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(r.width/vw, r.height/vh);
  octx.save();
  if(video.classList.contains('mirrored')){ octx.translate(r.width,0); octx.scale(-1,1); }
  octx.drawImage(video, (r.width-vw*scale)/2 * (video.classList.contains('mirrored')?-1:1) , (r.height-vh*scale)/2, vw*scale, vh*scale);
  octx.restore();
  octx.drawImage(skeletonCanvas, 0, 0, r.width, r.height);
  const link = document.createElement('a');
  link.download = 'vision-ai-'+Date.now()+'.png';
  link.href = out.toDataURL('image/png');
  link.click();
});

document.getElementById('btnFullscreen').addEventListener('click', () => {
  const el = document.getElementById('stage');
  if(!document.fullscreenElement) el.requestFullscreen?.();
  else document.exitFullscreen?.();
});

document.getElementById('closeBanner').addEventListener('click', () => document.getElementById('privacyBanner').classList.add('hidden'));
document.getElementById('btnInfo').addEventListener('click', () => document.getElementById('privacyBanner').classList.remove('hidden'));
setTimeout(() => document.getElementById('privacyBanner').classList.add('hidden'), 6000);

/* ---------------- boot ---------------- */
(async function boot(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){ throw new Error('Браузер не поддерживает доступ к камере.'); }
    await startCamera(facingMode);
    await loadModels();
    setStep('Готово');
    loading.classList.add('hidden');
    loop(performance.now());
    scheduleAnalysis();
  }catch(err){
    console.error(err);
    let msg = 'Не удалось запустить AI-сканер.';
    if(err.name === 'NotAllowedError') msg = 'Доступ к камере запрещён. Разрешите доступ к камере в настройках браузера и повторите попытку.';
    else if(err.name === 'NotFoundError') msg = 'Камера не найдена на этом устройстве.';
    else if(err.message) msg = err.message;
    showFatal(msg);
  }
})();
</script>
